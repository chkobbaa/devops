{% extends "base.html" %}

{% block title %}Signaler un incident{% endblock %}

{% block content %}
<section class="page-header">
    <h2>Signaler un nouvel incident</h2>
    <a href="{{ url_for('index') }}" class="btn">Retour à la liste</a>
</section>

{% if erreur %}
<div class="alert-error">{{ erreur }}</div>
{% endif %}

<form action="{{ url_for('add_incident') }}" method="post" class="incident-form">
    <div class="form-group">
        <label for="titre">Titre de l'incident</label>
        <input type="text" id="titre" name="titre" value="{{ form_data.get('titre', '') }}" required placeholder="Ex : Vidéoprojecteur en panne">
    </div>

    <div class="form-group">
        <label for="lieu">Lieu (salle ou laboratoire)</label>
        <input type="text" id="lieu" name="lieu" value="{{ form_data.get('lieu', '') }}" required placeholder="Ex : Salle B12">
    </div>

    <div class="form-group">
        <label for="priorite">Priorité</label>
        <select id="priorite" name="priorite" required>
            {% for p in priorites %}
            <option value="{{ p }}" {% if form_data.get('priorite') == p %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="description">Description du problème</label>
        <textarea id="description" name="description" rows="4" required placeholder="Décrivez le problème rencontré...">{{ form_data.get('description', '') }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">Enregistrer l'incident</button>
</form>
{% endblock %}
